name: "Placa nueva · New adapter"
description: "Una placa AIC8800 que el instalador no reconoce · An AIC8800 adapter the installer does not recognize"
labels: [placa-nueva]
body:
  - type: input
    id: adapter
    attributes:
      label: "Placa (marca/modelo, link de compra si tenés) · Adapter (brand/model, shop link if any)"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: "`lsusb` recién enchufada · right after plugging in"
      render: text
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: "`lsusb` en modo WiFi (si llegaste) · in Wi-Fi mode (if you got there)"
      description: "En Windows: Administrador de dispositivos → Propiedades → Detalles → Id. de hardware · On Windows: Device Manager → Properties → Details → Hardware Ids"
      render: text
  - type: textarea
    id: product
    attributes:
      label: "Nombre de producto USB · USB product string"
      description: "`cat /sys/bus/usb/devices/*/product`"
      render: text
